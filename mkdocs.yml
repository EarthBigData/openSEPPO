site_name: openSEPPO
site_description: Open SEPPO Tools - Supporting Geospatial and Remote Sensing Data Processing
site_url: https://openseppo.readthedocs.io/
repo_url: https://github.com/EarthBigData/openSEPPO
repo_name: EarthBigData/openSEPPO

docs_dir: doc

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - GCOV and GSLC Workflows: quickstart.md
  - Examples:
      - Hawaii Volcanoes (Kilauea): nisar_hawaii_examples.md
      - Python API / Jupyter: gcov_processing_overview.md
      - seppo_nisar_gcov_convert examples: nisar_gcov_convert_examples.md
      - seppo_nisar_gcov_convert dual-pol ratio: ratio.md
      - seppo_nisar_gunw_convert examples: nisar_gunw_convert_examples.md
      - seppo_nisar_sme2_convert examples: nisar_sme2_convert_examples.md
  - seppo_nisar_rslc_convert: nisar_rslc_convert_cli.md
  - seppo_nisar_gcov_convert: nisar_gcov_convert_cli.md
  - seppo_nisar_gslc_convert: nisar_gslc_convert_cli.md
  - seppo_nisar_gunw_convert: nisar_gunw_convert_cli.md
  - seppo_nisar_sme2_convert: nisar_sme2_convert_cli.md
  - seppo_nisar_coherence: nisar_coherence_cli.md
  - seppo_nisar_search: nisar_search_cli.md
  - seppo_earthaccess_credentials: earthaccess_credentials_cli.md

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
